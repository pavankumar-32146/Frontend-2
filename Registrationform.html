<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
</head>
<body>

    <h2>Login</h2>

    <form>
        <label>STUDENT ID </label><br>
        <input type="text" placeholder="Enter Student id"><br><br>

        <label>FULL NAME</label><br>
        <input type="text" placeholder="Enter Fullname"><br><br>

        <label>E-MAIL</label><br>
        <input type="email" placeholder="Enter e-mail"><br><br>


        <label>PHONE NUMBER</label><br>
        <input type="password" placeholder="Enter Phone number"><br><br>


        <label>DATE OF BIRTH</label><br>
        <input type="password" placeholder="Enter date of birth"><br><br>

        <label>GENDER</label><br>
        <input type="password" placeholder="Enter Gender"><br><br>


        <input type="submit" value="SUBMIT">
        <input type="reset" value="CLEAR">
    </form>

</body>
</html>
